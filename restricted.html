
<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Restricted</title>
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #08090c;
      color: #f5f5f5;
      font-family: Arial, sans-serif;
    }

    .card {
      width: min(90%, 430px);
      padding: 38px 28px;
      text-align: center;
      background: #111319;
      border: 1px solid #292c35;
      border-radius: 16px;
      box-shadow: 0 20px 70px #0008;
    }

    .icon {
      font-size: 42px;
      margin-bottom: 16px;
    }

    h1 {
      margin: 0 0 14px;
      font-size: 28px;
      letter-spacing: 5px;
    }

    p {
      color: #969baa;
      font-size: 14px;
      line-height: 1.7;
    }

    .status {
      display: inline-block;
      margin-top: 12px;
      padding: 8px 13px;
      border: 1px solid #593238;
      border-radius: 6px;
      background: #29171b;
      color: #ff858f;
      font-size: 12px;
    }

    footer {
      margin-top: 28px;
      color: #626775;
      font-size: 11px;
    }
  </style>
</head>
<body>
  <main class="card">
    <div class="icon">🔒</div>
    <h1>RESTRICTED</h1>
    <p>
      This resource is restricted.<br>
      Access is not available through the browser.
    </p>
    <div class="status">● ACCESS RESTRICTED</div>
    <footer>Protected Resource</footer>
  </main>
</body>
</html>
